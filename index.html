<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로젝트 평가 | AI와 공공데이터를 활용한 웹 앱 개발</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#18232E; --muted:#5B6773; --line:#CBD3DB;
  --civic:#0D6B6B; --civic-deep:#08504F; --civic-weak:#DCEDEC;
  --peer:#7CC4BE; --signal:#F2B705; --signal-weak:#FDF3D0; --danger:#B3261E; --danger-weak:#F7E1DF;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--civic);text-decoration:none}
a:hover{text-decoration:none}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 96px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
h1,h2,h3{line-height:1.3;margin:0}

/* 상단 띠 */
.band{background:var(--civic-deep);color:#fff}
.band .wrap{padding-top:22px;padding-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.band .course{font-size:.875rem;opacity:.8}
.band .title{font-size:1.125rem;font-weight:700}
.band .who{display:flex;align-items:center;gap:10px;font-size:.9375rem}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;cursor:pointer;font-weight:500;font-size:.9375rem;line-height:1;white-space:nowrap;text-decoration:none;transition:background .12s,border-color .12s}
.btn.sm{height:34px;padding:0 14px;font-size:.875rem}
.btn:hover{border-color:var(--civic)}
.btn.primary{background:var(--civic);border-color:var(--civic);color:#fff}
.btn.primary:hover{background:var(--civic-deep)}
.btn.ghost{background:transparent}
.btn.on-dark{background:transparent;border-color:rgba(255,255,255,.45);color:#fff}
.btn.on-dark:hover{background:rgba(255,255,255,.12);border-color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* 홈 */
.hero{padding:56px 0 36px}
.hero h1{font-size:clamp(1.75rem,4.5vw,2.75rem);font-weight:700;letter-spacing:-.02em}
.hero p{margin:14px 0 0;color:var(--muted);max-width:none}
.weights{display:flex;gap:3px;height:14px;margin-top:28px;max-width:520px;border-radius:3px;overflow:hidden}
.weights span{display:block}
.legend{display:flex;gap:20px;margin-top:10px;font-size:.875rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
.catalog{list-style:none;margin:8px 0 0;padding:0;border-top:2px solid var(--ink)}
.catalog li{border-bottom:1px solid var(--line)}
.catalog .sub-row .proj{padding-top:14px;padding-bottom:14px;background:rgba(220,237,236,.45)}
.catalog .sub-row .proj:hover{background:var(--civic-weak)}
.proj .fbno{font-size:1.25rem;color:var(--civic);text-align:center}
.catalog .sub-row .state{background:var(--surface);color:var(--civic-deep)}
.proj{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:16px;width:100%;padding:20px 8px;background:none;border:0;text-align:left;cursor:pointer}
.proj .no{font-size:1.75rem;font-weight:700;color:var(--civic);font-variant-numeric:tabular-nums}
.proj strong{display:block;font-size:1.125rem}
.proj .state{display:inline-flex;align-items:center;height:34px;padding:0 14px;font-size:.875rem;font-weight:500;border-radius:6px;border:1px solid var(--civic);background:var(--civic);color:#fff;white-space:nowrap}
.proj:hover:not(:disabled){background:var(--civic-weak)}
.proj:disabled{cursor:default}
.proj:disabled .no{color:var(--line)}
.proj:disabled strong{color:var(--muted)}
.proj:disabled .state{background:transparent;color:var(--muted);border:1px solid var(--line)}

/* 섹션 헤더 */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:32px 0 18px;flex-wrap:wrap}
.head h2{font-size:1.5rem}
.back{margin-top:24px}

/* 이름 그리드 */
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.name-btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 14px;font-weight:500;text-align:left;cursor:pointer;min-height:58px}
.name-btn:hover{border-color:var(--civic);background:var(--civic-weak)}

/* 탭 */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin-top:28px;overflow-x:auto}
.tab{background:none;border:0;padding:12px 18px;font-weight:500;color:var(--muted);cursor:pointer;border-radius:6px 6px 0 0;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.tab .cnt{font-size:.8125rem;margin-left:6px;opacity:.85;font-variant-numeric:tabular-nums}

/* 진행 막대 */
.progress{display:flex;align-items:center;gap:14px;margin:22px 0 14px}
.progress .track{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.progress .fill{height:100%;background:var(--civic)}
.progress b{font-variant-numeric:tabular-nums}

/* 평가 대상 목록 */
.targets{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.target{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:6px;text-align:left;cursor:pointer}
.target:hover:not(:disabled){border-color:var(--civic)}
.target:disabled{background:transparent;border-style:dashed;cursor:not-allowed}
.target .nm{font-weight:700}
.target .sub{display:block;font-size:.8125rem;color:var(--muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;font-size:.8125rem;font-weight:500;border-radius:6px;border:1px solid transparent;white-space:nowrap;line-height:1}
.pill.lg{height:34px;padding:0 12px;font-size:.875rem}
.pill.done{background:var(--civic-weak);border-color:#B5D6D4;color:var(--civic-deep)}
.pill.todo{background:var(--signal-weak);border-color:#EED78A;color:#7A5B00}
.pill.none{background:var(--bg);border-color:var(--line);color:var(--muted)}
.pill.off{background:var(--danger-weak);border-color:#EBBDB8;color:var(--danger)}

/* 평가 양식 */
.form{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px;margin-top:16px}
.form-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}
.form-top h2{font-size:1.5rem}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item{border:0;margin:0;padding:22px 0;border-bottom:1px solid var(--line)}
.item legend{padding:0;display:flex;justify-content:space-between;gap:12px;width:100%;font-weight:700;font-size:1.0625rem}
.item legend .mx{font-weight:500;color:var(--muted);font-size:.9375rem;white-space:nowrap}
.item .desc{margin:4px 0 14px;color:var(--muted);font-size:.9375rem}

/* 점수 막대 (선택형) */
.bar{display:flex;gap:4px;max-width:560px}
.seg{flex:1;min-width:0;height:44px;border:1px solid var(--line);background:var(--bg);border-radius:6px;cursor:pointer;font-weight:500;font-variant-numeric:tabular-nums;color:var(--muted);transition:background .12s,color .12s}
.seg:hover{border-color:var(--civic)}
.seg.on{background:var(--civic);border-color:var(--civic);color:#fff}
.seg.cur{background:var(--signal);border-color:#C99500;color:var(--ink);font-weight:700}

textarea{width:100%;min-height:120px;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--surface);line-height:1.6}
textarea:focus{border-color:var(--civic);outline:none;box-shadow:0 0 0 3px var(--civic-weak)}
.field{margin-top:16px}
.field label{display:block;font-weight:500;margin-bottom:6px}
.field .count{text-align:right;font-size:.8125rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.field .count.short{color:var(--danger)}
.req{color:var(--danger);margin-left:4px}

.submit-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:24px;flex-wrap:wrap}
.total{font-size:1.125rem}
.total b{font-size:1.75rem;font-variant-numeric:tabular-nums;color:var(--civic-deep)}
.err{color:var(--danger);font-size:.9375rem;margin:10px 0 0;white-space:pre-line}
.note{background:var(--signal-weak);border-left:4px solid var(--signal);padding:12px 16px;border-radius:0 6px 6px 0;margin-top:16px;font-size:.9375rem}

/* 교수자 */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.9375rem}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--civic-weak);font-weight:700;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.excl td{background:#F8F9FA;color:var(--muted)}
input[type=url],input[type=text],input[type=password]{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 12px;background:var(--surface)}
input[type=url]:focus,input[type=text]:focus,input[type=password]:focus{border-color:var(--civic);outline:none;box-shadow:0 0 0 3px var(--civic-weak)}
.chk{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--danger)}
.sticky-save{position:sticky;bottom:0;background:var(--bg);padding:14px 0;display:flex;justify-content:flex-end;gap:12px;align-items:center}

.wrap.wide{max-width:1180px}
.split{display:grid;grid-template-columns:300px 1fr;gap:20px;margin-top:20px;align-items:start}
.plist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.plist button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 14px;white-space:nowrap;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.plist button:hover{background:var(--civic-weak)}
.plist button[aria-current="true"]{background:var(--ink);color:#fff}
.plist .sc{font-variant-numeric:tabular-nums;font-size:.875rem}

.slider-row{display:grid;grid-template-columns:36px 1fr 36px 104px;gap:10px;align-items:center;margin-top:6px}
.slider-row .step{height:36px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-weight:700}
.slider-row output{font-size:1.25rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.slider-row output small{font-size:.8125rem;color:var(--muted);font-weight:400}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:4px;background:linear-gradient(to right,var(--civic) var(--pct,0%),var(--line) var(--pct,0%));cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--surface);border:3px solid var(--civic)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--civic)}

.ticks{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin:2px 46px 0;font-variant-numeric:tabular-nums}

.meter{display:flex;gap:3px;height:16px;margin:10px 0 4px}
.meter span{display:block;background:var(--line);border-radius:2px;overflow:hidden}
.meter span i{display:block;height:100%;background:var(--civic)}

.ref{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.ref div{background:var(--bg);border-radius:6px;padding:10px 12px;font-size:.875rem;color:var(--muted)}
.ref b{display:block;font-size:1.125rem;color:var(--ink);font-variant-numeric:tabular-nums}

details{margin-top:14px}
summary{cursor:pointer;font-weight:500;color:var(--civic)}
.fb{list-style:none;margin:10px 0 0;padding:0}
.fb li{padding:10px 0;border-bottom:1px dashed var(--line);font-size:.9375rem}
.fb .who{font-size:.8125rem;color:var(--muted)}

.mini{display:flex;align-items:center;justify-content:flex-end;gap:10px;white-space:nowrap}
.mtrack{display:inline-block;width:72px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.mfill{display:block;height:100%;background:var(--civic)}
.miss{display:flex;flex-wrap:wrap;gap:6px}

.fb-cards{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.fb-cards li{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
.fb-cards.plain{margin-top:20px}
.fb-cards.plain li{background:var(--bg);border-color:transparent}
.fb-cards p{margin:0;white-space:pre-wrap;line-height:1.7}
.fb-no{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;background:var(--civic-weak);color:var(--civic-deep);font-weight:700;font-size:.875rem;font-variant-numeric:tabular-nums}
.fb-meta{margin-top:6px;font-size:.8125rem;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted)}
.pw-box{max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px;margin-top:20px}
.pw-box .cur{font-size:1.25rem;font-weight:700;margin:4px 0 18px;font-variant-numeric:tabular-nums}

/* 모달 */
#modal{position:fixed;inset:0;background:rgba(24,35,46,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
#modal[hidden]{display:none}
.sheet{background:var(--surface);border-radius:10px;padding:28px;width:100%;max-width:400px}
.sheet h2{font-size:1.25rem}
.sheet p{margin:6px 0 16px}
.row-end{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

#loading{position:fixed;inset:0;background:rgba(237,240,243,.7);display:flex;align-items:center;justify-content:center;z-index:60;font-weight:500}
#loading[hidden]{display:none}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--civic);border-radius:50%;animation:sp 0.8s linear infinite;margin-right:12px}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:6px;z-index:70;font-weight:500;max-width:90vw}
#toast[hidden]{display:none}


/* 프로젝트 전환 (교수자) */
.pswitch{display:inline-flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-top:24px}
.pswitch button{height:34px;padding:0 16px;border:0;border-radius:6px;background:none;font-weight:500;color:var(--muted);cursor:pointer}
.pswitch button:hover{color:var(--ink)}
.pswitch button[aria-pressed="true"]{background:var(--civic);color:#fff}

/* 설정 카드 + 스위치 */
.setting{display:flex;justify-content:space-between;align-items:center;gap:20px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 22px;margin-top:24px}
.setting h3{font-size:1.0625rem}
.setting p{margin:4px 0 0;max-width:60em}
.switch{display:inline-flex;align-items:center;gap:10px;height:34px;padding:0 12px 0 4px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;font-weight:500;white-space:nowrap}
.switch .knob{width:26px;height:26px;border-radius:50%;background:var(--surface);border:1px solid var(--line);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--civic);border-color:var(--civic);color:#fff;padding:0 4px 0 12px;flex-direction:row-reverse}
.switch[aria-checked="true"] .knob{border-color:#fff}

/* 서술형 영역 */
.sec-title{font-size:1.0625rem;margin:22px 0 2px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.text-sec{margin-top:26px;padding:20px 22px;background:var(--bg);border-radius:8px}
.text-sec h3{font-size:1.0625rem}
.text-sec > p{margin:4px 0 0}
.text-sec textarea{background:var(--surface)}

/* 피드백 두 영역 */
.fb-parts{display:grid;gap:10px}
.fb-part p{margin:4px 0 0}
.fb-tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font-size:.8125rem;font-weight:700}
.fb-part.good .fb-tag{background:var(--civic-weak);color:var(--civic-deep)}
.fb-part.better .fb-tag{background:var(--signal-weak);color:#7A5B00}

/* 교수평가 상·중·하 */
:root{--lv-hi:#0D6B6B;--lv-mid:#D08C00;--lv-lo:#B3261E}
.lv-hi{--c:var(--lv-hi)} .lv-mid{--c:var(--lv-mid)} .lv-lo{--c:var(--lv-lo)}
input[type=range].rng{background:linear-gradient(to right,var(--fill,var(--civic)) var(--pct,0%),var(--line) var(--pct,0%))}
input[type=range].rng::-webkit-slider-thumb{border-color:var(--fill,var(--civic))}
input[type=range].rng::-moz-range-thumb{border-color:var(--fill,var(--civic))}
.slider-row{grid-template-columns:36px 1fr 36px 104px}
.slider-row output{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.lv-tag{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;background:var(--c);color:#fff;font-size:.8125rem;font-weight:700}
.meter span i.lv-hi,.meter span i.lv-mid,.meter span i.lv-lo{background:var(--c)}
.lv-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:.8125rem;color:var(--muted)}
.lv-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--c)}
.crit{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px}
.crit li{display:grid;grid-template-columns:26px 72px 1fr;gap:10px;align-items:start;padding:7px 10px;border-radius:6px;font-size:.875rem;color:var(--muted);border:1px solid transparent}
.crit li.cur{color:var(--ink);background:color-mix(in srgb,var(--c) 9%,white);border-color:color-mix(in srgb,var(--c) 35%,white)}
.crit-lv{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;font-size:.75rem;font-weight:700;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,white)}
.crit li.cur .crit-lv{background:var(--c);color:#fff;border-color:var(--c)}
.crit-rg{font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}
@media (max-width:720px){
  .wrap{padding:20px 16px 80px}
  .hero{padding:36px 0 24px}
  .form{padding:20px 16px}
  .split{grid-template-columns:1fr}
  .plist{display:flex;overflow-x:auto;border-radius:6px}
  .plist li{flex:0 0 auto}
  .plist button{border-bottom:0;border-right:1px solid var(--line);white-space:nowrap}
  .ref{grid-template-columns:1fr 1fr 1fr}
  .crit li{grid-template-columns:26px 1fr}
  .crit-rg{display:none}
  .setting{flex-direction:column;align-items:flex-start}
  .seg{height:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" hidden></div>
<div id="loading" hidden><div class="spin"></div>처리 중입니다</div>
<div id="toast" hidden role="status"></div>

<script>
/* ===== Apps Script 웹 앱 주소를 여기에 붙여넣으세요 ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbzNpdQVad6yPHc2tYF_9j6kFy6tZSGqPk4FqfWaEx_Lln1kvpaDMZ-ay3Lc4dko1E5A/exec';

async function api(action, payload = {}, opt = {}) {
  if (!API_URL || API_URL.indexOf('http') !== 0) throw new Error('index.html 의 API_URL 에 Apps Script 웹 앱 주소를 입력해야 합니다.');
  if (!opt.quiet) $('#loading').hidden = false;
  try {
    const r = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...payload }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.msg || '요청을 처리하지 못했습니다.');
    return j;
  } catch (e) {
    if (e instanceof TypeError) throw new Error('서버에 연결하지 못했습니다. 네트워크 상태를 확인한 뒤 다시 시도해 주세요.');
    throw e;
  } finally { if (!opt.quiet) $('#loading').hidden = true; }
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2600);
}

function openModal({ title, desc, type = 'password', inputmode = 'text', placeholder = '', submit = '확인', onSubmit }) {
  const m = $('#modal');
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h2 id="mt">${esc(title)}</h2><p class="muted">${esc(desc)}</p>
    <form id="mform" autocomplete="off"><input id="minput" name="f${Date.now()}" type="${type}" inputmode="${inputmode}" placeholder="${esc(placeholder)}" autocomplete="new-password" data-lpignore="true" data-1p-ignore readonly aria-label="${esc(title)}">
    <p id="merr" class="err" role="alert"></p>
    <div class="row-end"><button type="button" class="btn ghost" id="mcancel">취소</button><button class="btn primary">${esc(submit)}</button></div></form></div>`;
  m.hidden = false;
  // 브라우저 비밀번호 자동 채우기 방지: 빈 상태로 시작
  const mi = $('#minput');
  mi.value = '';
  setTimeout(() => { mi.value = ''; mi.removeAttribute('readonly'); mi.focus(); }, 60);
  setTimeout(() => { if (document.activeElement === mi && !mi.dataset.typed) mi.value = ''; }, 400);
  mi.addEventListener('input', () => { mi.dataset.typed = '1'; }, { once:true });
  $('#mcancel').onclick = closeModal;
  m.onclick = e => { if (e.target === m) closeModal(); };
  $('#mform').onsubmit = async e => {
    e.preventDefault();
    const v = $('#minput').value.trim();
    if (!v) { $('#merr').textContent = '값을 입력해 주세요.'; return; }
    try { await onSubmit(v); closeModal(); }
    catch (err) { $('#merr').textContent = err.message; $('#minput').select(); }
  };
}
function closeModal() { $('#modal').hidden = true; $('#modal').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });

function bindCounter(ta) {

  const upd = () => { const n = ta.value.trim().length; c.textContent = `${n}자${n < MIN_TEXT ? ` (최소 ${MIN_TEXT}자)` : ''}`; c.classList.toggle('short', n < MIN_TEXT); };

/* 점수 버튼 */
function scoreBar(idx, max, val, label) {
  let h = `<div class="bar" role="radiogroup" aria-label="${esc(label)}" data-idx="${idx}">`;
  for (let i = 1; i <= max; i++) {
    const cls = ['seg', (val !== null && i < val) ? 'on' : '', val === i ? 'cur' : ''].join(' ');
    h += `<button type="button" class="${cls}" data-v="${i}" role="radio" aria-checked="${val === i}" aria-label="${i}점">${i}</button>`;
  }
  return h + '</div>';
}
function paintBar(bar, v) {
  bar.querySelectorAll('.seg').forEach(s => {
    const i = +s.dataset.v;
    s.classList.toggle('on', i < v);
    s.classList.toggle('cur', i === v);
    s.setAttribute('aria-checked', i === v);
  });
}
document.addEventListener('click', e => {
  const s = e.target.closest('.seg'); if (!s || !FORM) return;
  const bar = s.parentElement, v = +s.dataset.v;
  FORM.vals[+bar.dataset.idx] = v;
  paintBar(bar, v);
  const el = $('#ftotal'); if (el) el.textContent = sum(FORM.vals);
});

function results() {
  const A = S.admin;
  const ex = new Set(A.students.filter(s => s.excluded).map(s => s.name));
  const prof = Object.fromEntries(A.profs.map(x => [x.name, x]));
  const self = Object.fromEntries(A.selves.map(x => [x.name, x]));
  return A.students.map(s => {
    const recv = A.peers.filter(p => p.target === s.name);
    const peerAvg = recv.length ? sum(recv.map(r => r.total)) / recv.length : null;
    const given = A.peers.filter(p => p.evaluator === s.name && !ex.has(p.target)).length;
    const need = A.students.filter(x => x.name !== s.name && !x.excluded).length;
    const pv = prof[s.name] ? prof[s.name].total : null;
    const sv = self[s.name] ? self[s.name].total : null;
    return { ...s, recv, peerAvg, given, need, prof:pv, profRec:prof[s.name] || null, self:sv, selfRec:self[s.name] || null,
      total: (pv || 0) + (peerAvg || 0) + (sv || 0) };
  });
}

/* 교수 평가: 슬라이더 + 상·중·하 색상 + 평가 기준 */
const LV = [{ k:'hi', n:'상' }, { k:'mid', n:'중' }, { k:'lo', n:'하' }];
function cut(max) { return { hi: Math.ceil(max * 0.8), mid: Math.ceil(max * 0.5) }; }
function level(v, max) { const c = cut(max); return v >= c.hi ? 0 : v >= c.mid ? 1 : 2; }
function ranges(max) {
  const c = cut(max);
  return [`${c.hi}–${max}점`, c.mid === c.hi - 1 ? `${c.mid}점` : `${c.mid}–${c.hi - 1}점`, `0–${c.mid - 1}점`];
}
function adminProfHTML() {
  const R = results();
  if (!S.profSel || !R.some(x => x.name === S.profSel)) S.profSel = R[0].name;
  const s = R.find(x => x.name === S.profSel);
  const vals = s.profRec ? s.profRec.scores.slice() : PROF_ITEMS.map(() => 0);
  FORM = { kind:'prof', target:s.name, vals };
  const labels = T().peer.map(x => x.label);
  return `<div class="split">
    <ul class="plist" aria-label="학생 목록">${R.map(x => `<li><button data-ps="${esc(x.name)}" aria-current="${x.name === S.profSel}">
      <span>${esc(x.name)}${x.excluded ? ' · 제외' : ''}</span><span class="sc">${x.prof === null ? '미입력' : x.prof + '점'}</span></button></li>`).join('')}</ul>
    <form class="form" id="profForm" style="margin-top:0" novalidate>
      <div class="form-top"><div><p class="muted small" style="margin:0">${esc(PROJ().name)} 교수평가 · 70점</p><h2>${esc(s.name)}</h2></div>
        <div class="top-actions">
        ${s.excluded ? '<span class="pill lg off">평가 제외(상호평가)</span>' : ''}
        ${s.prof === null ? '<span class="pill lg todo">미저장</span>' : '<span class="pill lg done">저장됨</span>'}
        ${appBtn(s.url)}</div></div>
      <div class="ref"><div>상호평가 평균<b>${fmt(s.peerAvg, 2)}</b>${s.recv.length}명 평가</div><div>자기평가<b>${s.self ?? '—'}</b>/ 10</div><div>현재 교수평가<b id="ptot2">${sum(vals)}</b>/ 70</div></div>
      <div class="lv-legend"><span><i class="lv-hi"></i>상 (80% 이상)</span><span><i class="lv-mid"></i>중 (50% 이상)</span><span><i class="lv-lo"></i>하 (50% 미만)</span></div>
      <div class="meter" id="meter" aria-hidden="true">${PROF_ITEMS.map((it,k) => `<span style="flex:${it.max}"><i class="lv-${LV[level(vals[k], it.max)].k}" style="width:${vals[k]/it.max*100}%"></i></span>`).join('')}</div>
      ${PROF_ITEMS.map((it, k) => {
        const lv = level(vals[k], it.max), rg = ranges(it.max);
        return `<div class="item pitem" data-k="${k}"><div style="display:flex;justify-content:space-between;gap:12px;font-weight:700"><label for="rg${k}">${esc(it.label)}</label><span class="muted" style="font-weight:500">${it.max}점</span></div>
        <p class="desc">${esc(it.desc)}</p>
        <div class="slider-row"><button type="button" class="step" data-k="${k}" data-d="-1" aria-label="1점 내리기">−</button>
          <input type="range" id="rg${k}" class="rng" data-k="${k}" min="0" max="${it.max}" step="1" value="${vals[k]}" style="--pct:${vals[k]/it.max*100}%;--fill:var(--lv-${LV[lv].k})">
          <button type="button" class="step" data-k="${k}" data-d="1" aria-label="1점 올리기">+</button>
          <output id="ov${k}"><span class="lv-tag lv-${LV[lv].k}">${LV[lv].n}</span>${vals[k]}<small> / ${it.max}</small></output></div>
        <ul class="crit" id="cr${k}">${LV.map((L, i) => `<li class="${i === lv ? 'cur lv-' + L.k : ''}"><span class="crit-lv lv-${L.k}">${L.n}</span><span class="crit-rg">${rg[i]}</span><span>${esc(it.levels[i])}</span></li>`).join('')}</ul></div>`;
      }).join('')}
      <div class="field"><label for="memo">메모 (선택, 학생에게 공개되지 않음)</label><textarea id="memo" style="min-height:80px" placeholder="채점 근거 메모">${esc(s.profRec ? s.profRec.memo : '')}</textarea></div>
      ${s.recv.length ? `<details><summary>받은 동료 피드백 ${s.recv.length}개 보기</summary><ul class="fb">${s.recv.map(r => `<li>${labels.map((l, i) => `<div><b class="small">${esc(l)}</b> ${esc(r.texts[i] || '')}</div>`).join('')}<div class="who">${esc(r.evaluator)} · ${r.total}/20</div></li>`).join('')}</ul></details>` : ''}
      <p class="err" id="ferr" role="alert"></p>
      <div class="submit-row"><div class="total">합계 <b id="ptot">${sum(vals)}</b> / 70점</div>
        <button class="btn primary" type="submit">교수평가 저장</button></div>
    </form></div>`;
}
function bindAdminProf() {
  document.querySelectorAll('[data-ps]').forEach(b => b.onclick = () => { S.profSel = b.dataset.ps; renderAdmin('prof'); });
  const setV = (k, v) => {
    const it = PROF_ITEMS[k], max = it.max; v = Math.max(0, Math.min(max, v));
    FORM.vals[k] = v;
    const lv = level(v, max), L = LV[lv];
    const rg = $('#rg' + k); rg.value = v;
    rg.style.setProperty('--pct', (v / max * 100) + '%'); rg.style.setProperty('--fill', `var(--lv-${L.k})`);
    $('#ov' + k).innerHTML = `<span class="lv-tag lv-${L.k}">${L.n}</span>${v}<small> / ${max}</small>`;
    $('#cr' + k).querySelectorAll('li').forEach((li, i) => { li.className = i === lv ? `cur lv-${LV[i].k}` : ''; });
    const mi = document.querySelectorAll('#meter i')[k]; mi.style.width = (v / max * 100) + '%'; mi.className = `lv-${L.k}`;
    $('#ptot').textContent = sum(FORM.vals); $('#ptot2').textContent = sum(FORM.vals);
  };
  document.querySelectorAll('.rng').forEach(r => r.addEventListener('input', () => setV(+r.dataset.k, +r.value)));
  document.querySelectorAll('.step').forEach(b => b.onclick = () => setV(+b.dataset.k, FORM.vals[+b.dataset.k] + (+b.dataset.d)));
  $('#profForm').onsubmit = async e => {
    e.preventDefault();
    const name = FORM.target;
    try {
      const r = await api('adminSaveProf', { p:S.p, adminPw:S.adminPw, target:name, scores:FORM.vals, memo:$('#memo').value.trim() });
      S.admin = r.data;
      toast(`${name} 학생 교수평가 ${sum(r.data.profs.find(x => x.name === name).scores)}점을 저장했습니다.`);
      renderAdmin('prof');
    } catch (err) { $('#ferr').textContent = err.message; }
  };
}

/* 결과 */
function adminResultHTML() {
  const R = results();
  const peerDone = R.filter(r => r.given >= r.need).length;
  const selfDone = R.filter(r => r.self !== null).length;
  const profDone = R.filter(r => r.prof !== null).length;
  return `<div class="head"><div><h2>평가 결과</h2>
    <p class="muted" style="margin:4px 0 0">상호평가 완료 ${peerDone}명 · 자기평가 제출 ${selfDone}명 · 교수평가 입력 ${profDone}명 (전체 ${R.length}명)</p></div>
    <div style="display:flex;gap:8px"><button class="btn" id="reload">새로고침</button><button class="btn primary" id="xls">엑셀 다운로드</button></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>이름</th><th class="num">교수(70)</th><th class="num">상호 평균(20)</th><th class="num">받은 평가</th><th class="num">자체(10)</th><th class="num">총점(100)</th><th class="num">상호평가 참여</th></tr></thead><tbody>
    ${R.map(r => `<tr class="${r.excluded ? 'excl' : ''}"><td><b>${esc(r.name)}</b>${r.excluded ? ' <span class="pill off">제외</span>' : ''}</td>
      <td class="num">${r.prof ?? '—'}</td><td class="num">${fmt(r.peerAvg, 2)}</td><td class="num">${r.recv.length}</td><td class="num">${r.self ?? '—'}</td>
      <td class="num"><b>${fmt(r.total, 2)}</b></td><td class="num">${r.given} / ${r.need}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="muted small">총점은 교수평가 + 상호평가 평균 + 자체평가입니다.</p>`;
}
function bindAdminResult() { $('#xls').onclick = downloadExcel; }

/* 평가 현황 */
function adminStatusHTML() {
  const A = S.admin;
  const rows = A.students.map(s => {
    const targets = A.students.filter(x => x.name !== s.name && !x.excluded);
    const missing = targets.filter(x => !A.peers.some(p => p.evaluator === s.name && p.target === x.name)).map(x => x.name);
    const self = A.selves.some(x => x.name === s.name);
    return { ...s, need: targets.length, given: targets.length - missing.length, missing, self, done: !missing.length && self };
  });
  const peerDone = rows.filter(r => !r.missing.length).length;
  const selfDone = rows.filter(r => r.self).length;
  const shown = S.onlyTodo ? rows.filter(r => !r.done) : rows;
  return `<div class="head"><div><h2>평가 현황</h2>
    <p class="muted" style="margin:4px 0 0">상호평가 완료 ${peerDone}명, 자기평가 제출 ${selfDone}명 (전체 ${rows.length}명)</p></div>
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><label class="chk"><input type="checkbox" id="onlyTodo" ${S.onlyTodo ? 'checked' : ''} style="accent-color:var(--civic)">미완료 학생만 보기</label>
    <button class="btn" id="reload">새로고침</button></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>이름</th><th class="num">상호평가</th><th>자기평가</th><th style="min-width:260px">아직 평가하지 않은 학생</th></tr></thead><tbody>
    ${shown.length ? shown.map(r => `<tr><td><b>${esc(r.name)}</b>${r.excluded ? ' <span class="pill off">제외</span>' : ''}</td>
      <td class="num"><div class="mini"><span class="mtrack"><span class="mfill" style="width:${r.need ? r.given / r.need * 100 : 100}%"></span></span>${r.given} / ${r.need}</div></td>
      <td>${r.self ? '<span class="pill done">제출</span>' : '<span class="pill todo">미제출</span>'}</td>
      <td>${r.missing.length ? `<div class="miss">${r.missing.map(n => `<span class="pill todo">${esc(n)}</span>`).join('')}</div>` : '<span class="muted small">모두 평가함</span>'}</td></tr>`).join('')
      : '<tr><td colspan="4" class="muted">모든 학생이 상호평가와 자기평가를 마쳤습니다.</td></tr>'}
    </tbody></table></div>
    <p class="muted small">평가 제외 학생은 평가 대상이 아니므로 '아직 평가하지 않은 학생'에 표시되지 않습니다. 학생들이 제출하는 중이라면 새로고침을 눌러 최신 상황을 확인하세요.</p>`;
}
function bindAdminStatus() {
  $('#onlyTodo').onchange = e => { S.onlyTodo = e.target.checked; renderAdmin('status'); };
}

function downloadExcel() {
  if (typeof XLSX === 'undefined') { toast('엑셀 라이브러리를 불러오지 못했습니다. 새로고침 후 다시 시도하세요.'); return; }
  const A = S.admin, R = results(), wb = XLSX.utils.book_new();
  const r2 = v => v === null ? '' : Math.round(v * 100) / 100;
  const t = v => v ? new Date(v).toLocaleString('ko-KR') : '';
  const PT = T().peer.map(x => x.label), ST = T().self.map(x => x.label);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
    ['이름','학번','평가 제외','교수평가(70)','상호평가 평균(20)','받은 상호평가 수','자체평가(10)','총점(100)','상호평가 참여','배포 주소'],
    ...R.map(r => [r.name, r.sid, r.excluded ? 'O' : '', r.prof ?? '', r2(r.peerAvg), r.recv.length, r.self ?? '', r2(r.total), `${r.given}/${r.need}`, r.url])
  ]), '종합');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
    ['이름', ...PROF_ITEMS.map(i => `${i.label}(${i.max})`), '합계(70)', '메모', '저장시각'],
    ...A.profs.map(x => [x.name, ...x.scores, x.total, x.memo, t(x.time)])
  ]), '교수평가');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
    ['평가자','피평가자', ...PEER_ITEMS.map(i => `${i.label}(${i.max})`), '합계(20)', ...PT, '제출시각'],
    ...A.peers.map(x => [x.evaluator, x.target, ...x.scores, x.total, ...x.texts, t(x.time)])
  ]), '상호평가 상세');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
    ['이름', ...SELF_ITEMS.map(i => `${i.label}(${i.max})`), '합계(10)', ...ST, '제출시각'],
    ...A.selves.map(x => [x.name, ...x.scores, x.total, ...x.texts, t(x.time)])
  ]), '자기평가');
  const d = new Date();
  XLSX.writeFile(wb, `${PROJ().name.replace(/\s/g, '')}_평가결과_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.xlsx`);
}

/* 피드백 (교수자) */
function adminFeedbackHTML() {
  const A = S.admin, labels = T().peer.map(x => x.label);
  const list = A.students.map(s => ({ ...s, fbs: A.peers.filter(p => p.target === s.name && p.texts.some(x => String(x).trim())) }));
  if (!S.fbSel || !list.some(x => x.name === S.fbSel)) S.fbSel = list[0].name;
  const cur = list.find(x => x.name === S.fbSel);
  return `${fbSwitchHTML()}
    <div class="split">
    <ul class="plist" aria-label="학생 목록">${list.map(x => `<li><button data-fs="${esc(x.name)}" aria-current="${x.name === S.fbSel}">
      <span>${esc(x.name)}${x.excluded ? ' · 제외' : ''}</span><span class="sc">${x.fbs.length}개</span></button></li>`).join('')}</ul>
    <section class="form" style="margin-top:0">
      <div class="form-top"><div><p class="muted small" style="margin:0">받은 상호평가 피드백</p><h2>${esc(cur.name)}</h2></div>
        <div class="top-actions">${cur.excluded ? '<span class="pill lg off">평가 제외</span>' : ''}<span class="pill lg none">${cur.fbs.length}개</span>
        <button class="btn sm" id="reload">새로고침</button></div></div>
      ${cur.fbs.length ? `<ol class="fb-cards plain">${cur.fbs.map((f, i) => `<li><span class="fb-no">${i + 1}</span><div>${fbBody(labels, f.texts)}
        <div class="fb-meta">${esc(f.evaluator)} · ${f.total} / 20점</div></div></li>`).join('')}</ol>`
        : '<div class="empty" style="margin-top:20px">받은 피드백이 없습니다.</div>'}
      <p class="muted small" style="margin-top:16px">학생 화면에서는 작성자 이름과 점수 없이 피드백 내용만 보입니다.</p>
    </section></div>`;
}
function bindAdminFeedback() {
  bindFbSwitch();
  document.querySelectorAll('[data-fs]').forEach(b => b.onclick = () => { S.fbSel = b.dataset.fs; renderAdmin('feedback'); });
}

/* ===== 시작 ===== */
(async function init() {
  const ss = store;
  try {
    if (ss.getItem('adminPw')) {
      const pw = ss.getItem('adminPw'), p = ss.getItem('adminP') || ADMIN_DEFAULT;
      const r = await api('adminLogin', { p, adminPw:pw });
      S.p = p; S.adminPw = pw; S.admin = r.data; return renderAdmin('students');
    }
    const p = ss.getItem('p');
    if (ss.getItem('gatePw') && p && PROJ(p) && PROJ(p).open) {
      const g = ss.getItem('gatePw');
      const r = await api('gate', { p, pw:g });
      S.p = p; S.gatePw = g; S.students = r.students;
      if (ss.getItem('me') && ss.getItem('sid')) {
        const r2 = await api('studentLogin', { p, gatePw:g, name:ss.getItem('me'), sid:ss.getItem('sid') });
        S.me = ss.getItem('me'); S.sid = ss.getItem('sid'); S.data = r2.data;
        return renderStudent('peer');
      }
      return renderNames();
    }
  } catch (e) { ss.clear(); }
  renderHome();
})();
</script>
</body>
